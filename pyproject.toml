[project]
name = "forecaster"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pandas<3",
    "scikit-learn>=1.9.0",
    "clickhouse-connect>=1.6.0",
    "mlflow>=3.15.1",
    "redis>=8.1.0",
    "python-dotenv>=1.2.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
